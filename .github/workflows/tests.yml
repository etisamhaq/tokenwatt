name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  unit:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      # The unit suite deliberately loads no model and needs no RAPL access, so
      # it runs on a plain runner. Topology and energy discovery are expected to
      # find nothing useful on a VM and must degrade rather than fail -- which is
      # itself part of what these tests check.
      - name: Run unit tests
        run: python3 tests/test_harness.py

      - name: Machine description must not crash
        run: python3 topology.py

      - name: RAPL probe must report cleanly when unavailable
        run: python3 energy.py --selftest || true
